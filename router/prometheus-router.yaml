apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prometheus
  namespace: prometheus
  annotations:
    konghq.com/strip-path: 'true'
spec:
  hostnames:
  - monitoring.moo.cd
  parentRefs:
  - name: kong
    namespace: default
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: prometheus-mine-grafana
      kind: Service
      port: 80
      namespace: prometheus

