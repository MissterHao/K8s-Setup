apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: loki
  namespace: loki
  annotations:
    konghq.com/strip-path: 'true'
spec:
  hostnames:
  - loki.moo.cd
  parentRefs:
  - name: kong
    namespace: default
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: loki
      kind: Service
      port: 3100
      namespace: loki

